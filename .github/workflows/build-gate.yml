# The build gate. Every push, no engine, no human.
#
# If this is red, nothing else matters. It is deliberately the only automation
# in this repository that needs no Unity licence, no multi-gigabyte image and
# nobody at a keyboard: the engine-side tests have their own runner
# (tools/run-playmode-tests.ps1) and they are not this.
#
# The steps below are the ticket's list in order: build, run the tests, run
# the scan against the committed AND freshly built assemblies, run the poison
# suite, run the source-level preprocessor test, play the committed replay
# bundle on the command line, and fail on any file over five megabytes. Four of
# those live inside `dotnet test`, because they are assertions rather than
# scripts and they have to be runnable from a shell on a laptop as well as
# here.
#
# The second job is Part III section 6's determinism matrix: the same match,
# played on three operating systems and two processor architectures, by two
# differently compiled images of the same simulation, all six required to
# produce the trace committed in this repository. It is separate from the gate
# above rather than folded into it, and the reason is in the comment on the job.
name: build gate

on: push

jobs:
  gate:
    name: simulation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      # First, because it is the cheapest and because a repository that has
      # already swallowed something huge is a repository whose history has to
      # be rewritten rather than fixed.
      - name: No tracked file over five megabytes
        shell: pwsh
        run: ./tools/check-file-sizes.ps1

      # A client-side check in an engine-free gate, which is only surprising
      # until you notice it never launches Unity: the expensive settings are
      # recorded in serialized YAML, and reading YAML needs no licence, no
      # project lock and nobody at a keyboard. Most of these arrived as
      # template defaults nobody chose, which is exactly why a one-time
      # confirmation is not enough -- a default nobody chose is a default
      # nobody would notice changing.
      - name: The client's expensive project settings are what was decided
        shell: pwsh
        run: ./tools/check-project-settings.ps1

      # The content the player ships with is a generated copy of the content
      # in content/, committed like a lockfile. There is an edit-mode test that
      # compares them, but it needs an engine and a licence and this gate has
      # neither -- and drift between an authored map and the map inside the
      # build is exactly the failure that would otherwise be found by somebody
      # wondering why the game disagrees with the tests.
      - name: The streaming copy of the content matches the authored content
        shell: pwsh
        run: ./tools/sync-streaming-content.ps1 -Check

      # Into scratch space, NOT into the default output path. The default
      # sends the build straight into client/Packages/com.ssalter.sim/Runtime/,
      # which would overwrite the committed assembly before anything had
      # looked at it -- and the whole arrangement here rests on the tests
      # exercising the bytes in the repository rather than bytes this runner
      # made. The tree-clean step at the bottom is what stops that mistake
      # being reintroduced quietly.
      - name: The simulation builds
        run: dotnet build sim --configuration Debug --nologo --output "${{ runner.temp }}/sim-build"

      # This one run covers: the arithmetic and dice tests against the
      # COMMITTED assembly; the IL scan over the committed assembly and over a
      # fresh build of the same sources; the poison suite, which builds
      # sim.poison and requires every banned row to fire from its own
      # violation; and the source-level ban on conditional compilation.
      #
      # Detailed verbosity so BudgetTests prints its measurement on the runs it
      # PASSES, not only the ones it fails. The budget is a ratio against a
      # reference workload timed on the same machine, and the whole point of
      # that design is that the headroom is a number somebody can read off a
      # green run and tune. At normal verbosity xUnit shows test output only
      # for failures, which is how a budget spent three days at 1.35x its limit
      # without anyone being able to see it coming.
      - name: Tests, IL scan on both images, poison suite, preprocessor ban
        run: dotnet test sim.tests --configuration Debug --nologo --logger "console;verbosity=detailed"

      # The observation the headless runner exists for: play the committed
      # bundle and require the trace and the landmark table it produces to be
      # the ones in the repository, line for line.
      #
      # It writes into scratch space and compares, rather than writing over the
      # committed files and finding them equal -- which would be a check that
      # cannot fail. It is also the step that exercises the static command-line
      # entry point itself, so a runner that rots is a red gate rather than a
      # quiet one, and it runs the COMMITTED simulation assembly, so a source
      # change pushed without its rebuild produces a different trace here.
      - name: The committed bundle still produces the committed trace and landmarks
        shell: pwsh
        run: ./tools/run-headless-match.ps1 -Verify

      # A gate that rewrites the repository it is checking is worse than no
      # gate. Deliberately an assertion and not a cleanup: a step that repairs
      # what it finds is a step that can never fail, and would have gone green
      # through every regression it exists to catch.
      - name: The gate did not rewrite the repository
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "The gate left the working tree dirty:"
            git status --porcelain
            git diff --stat
            exit 1
          fi

  # Part III section 6's matrix, and the answer to the one question the gate
  # above cannot ask: whether the simulation is the same simulation somewhere
  # else. Six runs -- three operating systems, two of them x64 and one arm64,
  # each playing two differently compiled images -- and every one of them has to
  # produce the trace, the landmark table and the golden results committed in
  # this repository, byte for byte.
  #
  # WHAT THE TWO IMAGES ARE, AND WHY IT IS NOT `--configuration Release`.
  # Everything here references the committed Sim.dll by HintPath, deliberately,
  # so the gate exercises the bytes in the repository rather than bytes a runner
  # made. Those bytes are a Debug build and CommittedAssemblyTests requires them
  # to stay one, because the conditional-diagnostics row of the IL scan can only
  # fire against a Debug image. So `dotnet test --configuration Release` would
  # build the test assembly in Release and go on playing the same committed
  # Debug simulation: a Release row that cannot fail. The Debug row here is the
  # committed image, which is what ships and what the engine loads; the Release
  # row builds sim/ from source with the optimiser on and plays that. The runner
  # asserts which image it actually loaded rather than trusting the property
  # that was supposed to point it there.
  #
  # WHY `dotnet test` IS NOT IN HERE. The IL scan, the poison suite, the
  # file-size check and the project-settings check are assertions about files,
  # and a file is the same file on three operating systems. Running them six
  # ways would buy nothing. Determinism is what this job tests, and it is all
  # this job tests.
  #
  # This paragraph used to carry a second reason: that running the tests here
  # would put BudgetTests -- then a wall-clock timing test with a hard-coded
  # ten-millisecond median -- onto three classes of runner, "where it is a flake
  # waiting to be muted". That reasoning was right, and it was right about the
  # gate job above too, which is where the test actually lived: it went red on
  # `main` from 3 to 6 Aug 2026 on a docs-only merge, twice, on a tick loop that
  # had not changed. The budget is now a ratio against a reference workload
  # timed on the same machine in the same run, so it no longer has a runner
  # speed term and would survive this matrix. It is still not run here, for the
  # first reason only: six runs of it would cost six times the wall clock to
  # test the one thing this job does not care about.
  determinism:
    name: ${{ matrix.simulation }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      # Every row runs even after one has gone red. "Something diverged" is not
      # the finding; "these two platforms diverged and that one did not" is, and
      # a matrix that stops at the first failure throws it away.
      fail-fast: false

      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        simulation: [Committed, FreshRelease]

        # The architecture each row is claimed to be, so the claim is checked
        # rather than inherited from documentation. macos-latest being arm64 is
        # the only reason this matrix tests a second processor architecture at
        # all, and it is a fact about GitHub's fleet rather than about this
        # repository -- so if it ever changes, this should go red and say so,
        # instead of quietly becoming three runs of x64.
        include:
          - os: ubuntu-latest
            architecture: X64
          - os: windows-latest
            architecture: X64
          - os: macos-latest
            architecture: Arm64

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: This runner is the architecture the matrix says it is
        shell: pwsh
        run: |
          $actual = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture
          Write-Host "runner architecture $actual"
          if ("$actual" -ne "${{ matrix.architecture }}") {
            Write-Host "The matrix calls this row ${{ matrix.architecture }}; the runner is $actual."
            exit 1
          }

      # The row itself. -Verify plays the committed bundle and compares the
      # trace, the landmark table and every historical golden result against
      # the committed copies, writing into scratch space rather than over them.
      - name: This platform produces the committed trace, landmarks and goldens
        shell: pwsh
        run: ./tools/run-headless-match.ps1 -Verify -Simulation ${{ matrix.simulation }}

      # The same assertion the gate makes, made again on a Windows working tree
      # and a macOS one -- which is where it is actually interesting. The
      # comparison above is byte for byte against files a Windows checkout is
      # entitled to rewrite the line endings of, and .gitattributes pinning
      # content/** to LF is the thing that stops it. This is what checks that.
      - name: The row did not rewrite the repository
        shell: pwsh
        run: |
          $dirty = git status --porcelain
          if ($dirty) {
            Write-Host "The row left the working tree dirty:"
            $dirty
            git diff --stat
            exit 1
          }
